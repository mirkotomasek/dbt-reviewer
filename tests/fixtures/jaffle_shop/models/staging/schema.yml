# Adapted from jaffle_shop_duckdb: only relevant key declarations retained.
version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
  - name: stg_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
      - name: payment_method
      - name: amount
