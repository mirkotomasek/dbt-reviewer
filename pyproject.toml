[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbt-reviewer"
version = "0.1.0"
description = "Diff-aware code review for dbt SQL models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1,<4",
    "pydantic>=2.9,<3",
    "unidiff>=0.7.5,<2",
    "PyYAML>=6,<7",
    "openai>=2,<4",
    "sqlglot>=28,<31",
    "sqlfluff>=3.4,<5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
dbt-review = "dbt_reviewer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not semantic'"
markers = ["semantic: opt-in live OpenAI evaluation (requires OPENAI_API_KEY; incurs API usage)"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/dbt_reviewer"]
check_untyped_defs = true
ignore_missing_imports = true
